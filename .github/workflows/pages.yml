name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      catalog_commit:
        description: Expected commit when dispatched by public catalog preparation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.catalog_commit && inputs.catalog_commit != github.sha && format('pages-stale-catalog-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify dispatched catalog commit
        if: inputs.catalog_commit != ''
        env:
          EXPECTED_COMMIT: ${{ inputs.catalog_commit }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" == "$EXPECTED_COMMIT" ]] || {
            echo 'The catalog dispatch no longer matches main. Check the Pages run for the newer commit.'
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check dependency security advisories
        run: npm audit --audit-level=high

      - name: Install media decoder
        timeout-minutes: 25
        shell: bash
        run: |
          download_ffmpeg() {
            sudo timeout --kill-after=10s 2m apt-get "$@" --error-on=any update &&
              sudo timeout --kill-after=10s 3m apt-get "$@" --yes --download-only --no-install-recommends install ffmpeg
          }

          apt_sources=()
          if ! download_ffmpeg; then
            echo "::warning::FFmpeg download from runner sources failed. Retrying via Ubuntu archives."
            source /etc/os-release
            alternate_sources=$(mktemp --suffix=.list)
            trap 'rm -f -- "$alternate_sources"' EXIT
            cat > "$alternate_sources" <<EOF
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME:?} main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-security main universe
          EOF
            apt_sources=(-o "Dir::Etc::sourcelist=$alternate_sources" -o "Dir::Etc::sourceparts=-")
            download_ffmpeg "${apt_sources[@]}"
          fi

          sudo apt-get "${apt_sources[@]}" --yes --no-download --no-install-recommends install ffmpeg
          ffmpeg -version

      - name: Run quality gate
        timeout-minutes: 15
        run: npm run --silent quality:ci

  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare static artifact
        run: npm run --silent pages:prepare -- --base-mib=12 --per-species-mib=2.5 --absolute-max-mib=500

      - name: Validate artifact paths
        run: npm run --silent pages:check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
