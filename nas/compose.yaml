services:
  project:
    image: fn-arten-explorer-project:0.1.3
    build:
      context: ..
      dockerfile: nas/Dockerfile
    platform: linux/amd64
    user: "${FN_PROJECT_UID:?Lokale NAS-Benutzerkennung erforderlich}:${FN_PROJECT_GID:?Lokale NAS-Gruppenkennung erforderlich}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - type: bind
        source: ${FN_PROJECT_DIRECTORY:?Bestätigter lokaler NAS-Datenordner erforderlich}
        target: /project
        bind:
          create_host_path: false
      - type: bind
        source: ${FN_PROJECT_CONFIGURATION:?Vorbereiteter Konfigurationsordner erforderlich}
        target: /configuration
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 30s
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - 'import http from "node:http"; import fs from "node:fs"; const check=(host,expected)=>new Promise((resolve,reject)=>{const r=http.get({host:"127.0.0.1",port:4317,path:"/api/v1/catalog",headers:{Host:host}},s=>{s.resume();s.on("end",()=>s.statusCode===expected?resolve():reject(new Error("Unexpected HTTP status")));});r.on("error",reject);r.setTimeout(3000,()=>r.destroy(new Error("Timeout")));}); const db=fs.lstatSync("/project/project.sqlite");if(!db.isFile()||db.isSymbolicLink()||db.uid!==process.getuid())throw new Error("Database ownership mismatch");await check("127.0.0.1:4317",401);await check("invalid.example",421);'
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
